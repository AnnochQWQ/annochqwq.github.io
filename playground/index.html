<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小玩意</title>
    <link rel="stylesheet" href="/assets/style.css">
    <script src="/assets/load.js" defer></script>
    <style>
        .tool-list { list-style: none; padding: 0; }
        .tool-list li { padding: 14px 0; border-bottom: 1px solid #eee; }
        .tool-list a { color: #222; text-decoration: none; font-size: 18px; font-weight: 500; display: block; }
        .tool-list a:hover { color: #1a73e8; }
        .tool-list .file-icon { color: #999; font-size: 14px; font-weight: normal; margin-left: 10px; }
        .loading, .empty, .error { padding: 32px 0; text-align: center; color: #888; }
        .error { color: #c0392b; }
    </style>
</head>
<body>
    <div class="container">
        <div class="site-title"><a href="/">游戏繁殖基地</a></div>
        <div class="site-desc"></div>
        <div id="nav-placeholder"></div>
        <div id="content"><div class="loading">加载中...</div></div>
        <div class="footer">&copy; 2026 游戏繁殖基地</div>
    </div>
    <script>
        async function loadTools() {
            var c = document.getElementById('content');
            try {
                var res = await fetch('/index.json');
                if (!res.ok) throw new Error('');
                var data = await res.json();
                var files = data.playground || [];
                if (files.length === 0) {
                    c.innerHTML = '<div class="empty">还没有小玩意</div>';
                    return;
                }
                files.sort();
                var html = '<ul class="tool-list">';
                for (var name of files) {
                    html += '<li><a href="' + name + '.html">' + name + ' <span class="file-icon">.html</span></a></li>';
                }
                html += '</ul>';
                c.innerHTML = html;
            } catch {
                c.innerHTML = '<div class="error">加载失败</div>';
            }
        }
        loadTools();
    </script>
</body>
</html>
