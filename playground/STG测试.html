<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, touch-action: manipulation">
  <title>幻想录 · 东方STG弹幕游戏</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0a0a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', 'Arial', sans-serif;
      touch-action: pan-x pan-y pinch-zoom;
    }
    #gameContainer {
      position: relative;
      width: 100%;
      max-width: 400px;
      aspect-ratio: 3 / 4;
      box-shadow: 0 0 40px rgba(100, 100, 255, 0.3);
      border-radius: 12px;
      overflow: hidden;
      background: #010118;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 20% 20%, #1a1a3a, #030311);
    }
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 8px;
      color: white;
      text-shadow: 2px 2px 0 #000;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .bottom-bar {
      display: flex;
      justify-content: center;
      gap: 20px;
      font-size: 12px;
      background: rgba(0,0,0,0.5);
      padding: 6px;
      border-radius: 20px;
      margin-bottom: 5px;
      backdrop-filter: blur(4px);
    }
    .control-hint {
      display: flex;
      gap: 15px;
    }
    .mobile-controls {
      position: absolute;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 30px;
      pointer-events: auto;
      opacity: 0.7;
    }
    .dpad {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .dpad-row {
      display: flex;
      gap: 20px;
    }
    .dpad-btn {
      width: 45px;
      height: 45px;
      background: rgba(255,255,255,0.15);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: white;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.3);
      user-select: none;
      touch-action: none;
      cursor: pointer;
    }
    .select-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 20, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      pointer-events: auto;
      backdrop-filter: blur(5px);
    }
    .character-cards {
      display: flex;
      gap: 20px;
      margin: 25px 0;
    }
    .card {
      width: 90px;
      height: 130px;
      background: rgba(255,255,255,0.1);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 2px solid transparent;
      cursor: pointer;
      transition: 0.2s;
      backdrop-filter: blur(4px);
    }
    .card.selected {
      border-color: #ffcc00;
      box-shadow: 0 0 25px #ffaa00;
      background: rgba(255,200,0,0.2);
    }
    .card span {
      font-size: 28px;
      margin-bottom: 8px;
    }
    button {
      background: #e6c300;
      border: none;
      padding: 12px 35px;
      border-radius: 40px;
      font-weight: bold;
      font-size: 18px;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255,200,0,0.5);
      margin-top: 10px;
    }
    @media (max-width: 500px) {
      .dpad-btn {
        width: 40px;
        height: 40px;
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
<div id="gameContainer">
  <canvas id="gameCanvas" width="300" height="400"></canvas>
  <div id="ui-layer">
    <div class="top-bar">
      <span id="scoreDisplay">灵梦</span>
      <span>❤️ <span id="livesDisplay">3</span></span>
    </div>
    <div class="bottom-bar">
      <span id="bossHpDisplay">BOSS</span>
    </div>
  </div>
  <!-- 移动端方向键 -->
  <div class="mobile-controls" id="mobileControls">
    <div class="dpad">
      <div class="dpad-row">
        <div class="dpad-btn" data-dir="up">▲</div>
      </div>
      <div class="dpad-row">
        <div class="dpad-btn" data-dir="left">◀</div>
        <div class="dpad-btn" data-dir="down">▼</div>
        <div class="dpad-btn" data-dir="right">▶</div>
      </div>
    </div>
  </div>
  <!-- 角色选择界面 -->
  <div class="select-screen" id="selectScreen">
    <h2 style="font-size:26px; margin-bottom:10px;">✨ 选择自机 ✨</h2>
    <div class="character-cards">
      <div class="card selected" data-char="reimu">
        <span>🔴</span>
        <strong>灵梦</strong>
        <small>追踪符</small>
      </div>
      <div class="card" data-char="marisa">
        <span>⭐</span>
        <strong>魔理沙</strong>
        <small>激光</small>
      </div>
    </div>
    <button id="startGameBtn">开始战斗</button>
    <p style="margin-top:20px; font-size:12px; opacity:0.8;">PC: 方向键移动 | 移动端: 按钮</p>
  </div>
</div>

<script>
  (function(){
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // UI元素
    const scoreDisplay = document.getElementById('scoreDisplay');
    const livesDisplay = document.getElementById('livesDisplay');
    const bossHpDisplay = document.getElementById('bossHpDisplay');
    const selectScreen = document.getElementById('selectScreen');
    const mobileControls = document.getElementById('mobileControls');

    // 游戏尺寸
    const W = 300, H = 400;

    // 游戏状态
    let gameActive = false;
    let player = null;
    let bullets = [];
    let enemyBullets = [];
    let enemies = [];
    let boss = null;
    let score = 0;
    let lives = 3;
    let invincible = 0;
    let characterType = 'reimu'; // 默认灵梦

    // 移动控制标志
    const keys = {
      ArrowLeft: false, ArrowRight: false, ArrowUp: false, ArrowDown: false
    };

    // ----- 玩家类 -----
    class Player {
      constructor(x, y, type) {
        this.x = x;
        this.y = y;
        this.width = 8;
        this.height = 8;
        this.type = type;
        this.speed = 3.2;
        this.shootCooldown = 0;
        this.power = 1;
      }

      update() {
        // 移动处理 (来自键盘或触摸标志)
        let dx = 0, dy = 0;
        if (keys.ArrowLeft) dx -= 1;
        if (keys.ArrowRight) dx += 1;
        if (keys.ArrowUp) dy -= 1;
        if (keys.ArrowDown) dy += 1;

        if (dx !== 0 || dy !== 0) {
          const len = Math.sqrt(dx*dx+dy*dy);
          dx /= len;
          dy /= len;
          this.x += dx * this.speed;
          this.y += dy * this.speed;
        }

        // 边界限制
        this.x = Math.max(10, Math.min(W-10, this.x));
        this.y = Math.max(20, Math.min(H-20, this.y));

        // 射击
        if (this.shootCooldown > 0) {
          this.shootCooldown--;
        } else {
          this.shoot();
          this.shootCooldown = this.type === 'reimu' ? 8 : 12;
        }
      }

      shoot() {
        if (!gameActive) return;
        if (this.type === 'reimu') {
          // 灵梦：追踪型符札
          bullets.push(new PlayerBullet(this.x, this.y-6, -4, 0, 'homing'));
        } else {
          // 魔理沙：强力激光直线
          bullets.push(new PlayerBullet(this.x, this.y-6, 0, -5.5, 'laser'));
        }
      }

      draw(ctx) {
        ctx.save();
        // 无敌闪烁
        if (invincible > 0 && Math.floor(Date.now()/100)%2===0) {
          ctx.globalAlpha = 0.5;
        }
        // 绘制自机
        ctx.shadowColor = this.type==='reimu' ? '#ff5555' : '#ffaa00';
        ctx.shadowBlur = 12;
        ctx.fillStyle = this.type==='reimu' ? '#e63946' : '#f4a261';
        ctx.beginPath();
        ctx.arc(this.x, this.y, 7, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = 'white';
        ctx.beginPath();
        ctx.arc(this.x-2, this.y-2, 2, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#fff9e6';
        ctx.beginPath();
        ctx.arc(this.x, this.y-4, 2.5, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
      }
    }

    // 玩家子弹
    class PlayerBullet {
      constructor(x, y, vx, vy, type) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.type = type;
        this.radius = 3;
        this.active = true;
      }
      update() {
        // 追踪逻辑 (灵梦)
        if (this.type === 'homing') {
          let target = null;
          if (boss && boss.hp > 0) target = boss;
          else if (enemies.length > 0) target = enemies[0];
          if (target) {
            const angle = Math.atan2(target.y - this.y, target.x - this.x);
            this.vx = Math.cos(angle) * 4.2;
            this.vy = Math.sin(angle) * 4.2;
          } else {
            this.vy = -4;
            this.vx = 0;
          }
        }
        this.x += this.vx;
        this.y += this.vy;
        if (this.y < -10 || this.y > H+10 || this.x < -10 || this.x > W+10) {
          this.active = false;
        }
      }
      draw(ctx) {
        ctx.fillStyle = this.type==='laser' ? '#ffdd55' : '#ff7777';
        ctx.shadowBlur = 8;
        ctx.shadowColor = this.type==='laser' ? '#ffaa00' : '#ff0000';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, 2*Math.PI);
        ctx.fill();
      }
    }

    // 敌方子弹
    class EnemyBullet {
      constructor(x, y, vx, vy, color='#ff88aa') {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.radius = 4;
        this.color = color;
        this.active = true;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.y > H+15 || this.y < -15 || this.x < -15 || this.x > W+15) this.active = false;
      }
      draw(ctx) {
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, 2*Math.PI);
        ctx.fill();
      }
    }

    // Boss类
    class Boss {
      constructor() {
        this.x = W/2;
        this.y = 60;
        this.width = 28;
        this.height = 28;
        this.hp = 100;
        this.maxHp = 100;
        this.phase = 0;
        this.timer = 0;
        this.movePattern = 0;
      }
      update() {
        if (this.hp <= 0) return;
        this.timer++;
        // 左右飘移
        this.x = W/2 + Math.sin(this.timer * 0.03) * 70;
        this.y = 55 + Math.cos(this.timer * 0.05) * 10;

        // 攻击模式
        if (this.timer % 25 === 0) {
          this.shootPattern();
        }
      }
      shootPattern() {
        const count = 12;
        for (let i=0; i<count; i++) {
          const angle = (i/count)*Math.PI*2 + this.timer*0.1;
          const vx = Math.cos(angle)*2.2;
          const vy = Math.sin(angle)*2.2;
          enemyBullets.push(new EnemyBullet(this.x, this.y, vx, vy, '#ff44aa'));
        }
        // 额外密集弹幕
        if (this.hp < 50) {
          for (let i=0; i<6; i++) {
            const angle = Math.random()*Math.PI*2;
            enemyBullets.push(new EnemyBullet(this.x, this.y, Math.cos(angle)*2.8, Math.sin(angle)*2.8, '#ffaa00'));
          }
        }
      }
      draw(ctx) {
        ctx.save();
        ctx.shadowBlur = 18;
        ctx.shadowColor = '#cc33aa';
        ctx.fillStyle = '#b53772';
        ctx.beginPath();
        ctx.ellipse(this.x, this.y, this.width/2, this.height/2, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#ffdddd';
        ctx.beginPath();
        ctx.arc(this.x-5, this.y-4, 4, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(this.x+5, this.y-4, 4, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(this.x-4, this.y-5, 1.5, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(this.x+6, this.y-5, 1.5, 0, Math.PI*2);
        ctx.fill();
        // HP条
        ctx.fillStyle = '#333';
        ctx.fillRect(this.x-25, this.y-22, 50, 6);
        ctx.fillStyle = '#ff4466';
        const hpPercent = this.hp/this.maxHp;
        ctx.fillRect(this.x-25, this.y-22, 50*hpPercent, 6);
        ctx.restore();
      }
    }

    // 碰撞检测
    function checkCollisions() {
      // 玩家子弹 vs Boss
      if (boss && boss.hp > 0) {
        for (let b of bullets) {
          if (!b.active) continue;
          const dx = b.x - boss.x;
          const dy = b.y - boss.y;
          const dist = Math.sqrt(dx*dx+dy*dy);
          if (dist < (boss.width/2 + b.radius)) {
            b.active = false;
            boss.hp -= 1;
            score += 10;
            if (boss.hp <= 0) {
              score += 500;
              boss = null;
            }
          }
        }
      }
      // 敌方子弹 vs 玩家
      if (invincible <= 0 && player) {
        for (let eb of enemyBullets) {
          if (!eb.active) continue;
          const dx = eb.x - player.x;
          const dy = eb.y - player.y;
          if (Math.sqrt(dx*dx+dy*dy) < (eb.radius + 7)) {
            eb.active = false;
            lives--;
            invincible = 90; // 约1.5秒无敌
            if (lives <= 0) {
              gameOver();
            }
            break;
          }
        }
      }
    }

    function spawnBoss() {
      if (!boss && enemies.length === 0 && gameActive) {
        boss = new Boss();
      }
    }

    function gameOver() {
      gameActive = false;
      alert('💀 败北 · 重启选择角色');
      resetGame();
    }

    function resetGame() {
      gameActive = false;
      player = null;
      bullets = [];
      enemyBullets = [];
      enemies = [];
      boss = null;
      lives = 3;
      score = 0;
      invincible = 0;
      selectScreen.style.display = 'flex';
      mobileControls.style.display = 'none';
    }

    function startGame() {
      gameActive = true;
      lives = 3;
      score = 0;
      invincible = 60;
      bullets = [];
      enemyBullets = [];
      enemies = [];
      boss = null;
      player = new Player(W/2, H-60, characterType);
      selectScreen.style.display = 'none';
      mobileControls.style.display = 'flex';
    }

    // 更新UI
    function updateUI() {
      scoreDisplay.textContent = characterType==='reimu' ? '灵梦' : '魔理沙';
      livesDisplay.textContent = lives;
      if (boss && boss.hp>0) {
        bossHpDisplay.textContent = `BOSS ❤️ ${Math.ceil(boss.hp)}`;
      } else {
        bossHpDisplay.textContent = 'BOSS 击破!';
      }
    }

    // 游戏循环
    function gameLoop() {
      ctx.clearRect(0,0,W,H);
      if (gameActive) {
        // 更新
        if (player) player.update();
        bullets.forEach(b=>b.update());
        enemyBullets.forEach(b=>b.update());
        if (boss) boss.update();
        if (invincible>0) invincible--;

        bullets = bullets.filter(b=>b.active);
        enemyBullets = enemyBullets.filter(b=>b.active);
        checkCollisions();
        spawnBoss();

        // 绘制
        if (player) player.draw(ctx);
        bullets.forEach(b=>b.draw(ctx));
        enemyBullets.forEach(b=>b.draw(ctx));
        if (boss && boss.hp>0) boss.draw(ctx);
        updateUI();
      }
      requestAnimationFrame(gameLoop);
    }

    // ----- 事件绑定 -----
    // 键盘
    window.addEventListener('keydown', (e) => {
      if (e.key.startsWith('Arrow')) {
        e.preventDefault();
        if (keys.hasOwnProperty(e.key)) keys[e.key] = true;
      }
    });
    window.addEventListener('keyup', (e) => {
      if (e.key.startsWith('Arrow')) {
        e.preventDefault();
        if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
      }
    });

    // 移动端方向按钮
    function setupMobileControls() {
      const btns = document.querySelectorAll('.dpad-btn');
      btns.forEach(btn => {
        const dir = btn.getAttribute('data-dir');
        const keyMap = { up:'ArrowUp', down:'ArrowDown', left:'ArrowLeft', right:'ArrowRight' };
        const key = keyMap[dir];

        btn.addEventListener('touchstart', (e) => {
          e.preventDefault();
          if (keys.hasOwnProperty(key)) keys[key] = true;
        });
        btn.addEventListener('touchend', (e) => {
          e.preventDefault();
          if (keys.hasOwnProperty(key)) keys[key] = false;
        });
        btn.addEventListener('touchcancel', (e) => {
          e.preventDefault();
          if (keys.hasOwnProperty(key)) keys[key] = false;
        });
        // 鼠标备用
        btn.addEventListener('mousedown', (e) => {
          if (keys.hasOwnProperty(key)) keys[key] = true;
        });
        btn.addEventListener('mouseup', (e) => {
          if (keys.hasOwnProperty(key)) keys[key] = false;
        });
        btn.addEventListener('mouseleave', (e) => {
          if (keys.hasOwnProperty(key)) keys[key] = false;
        });
      });
    }

    // 角色选择
    document.querySelectorAll('.card').forEach(card => {
      card.addEventListener('click', () => {
        document.querySelectorAll('.card').forEach(c=>c.classList.remove('selected'));
        card.classList.add('selected');
        characterType = card.getAttribute('data-char');
      });
    });

    document.getElementById('startGameBtn').addEventListener('click', startGame);

    setupMobileControls();
    // 初始隐藏移动控件
    mobileControls.style.display = 'none';
    selectScreen.style.display = 'flex';

    // 启动循环
    gameLoop();
  })();
</script>
</body>
</html>
