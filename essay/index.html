<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随笔</title>
    <link rel="stylesheet" href="/assets/style.css">
    <script src="/assets/load.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <style>
        .list { list-style: none; padding: 0; }
        .list li { padding: 14px 0; border-bottom: 1px solid #eee; }
        .list a { color: #222; text-decoration: none; font-size: 18px; font-weight: 500; display: block; }
        .list a:hover { color: #1a73e8; }
        .list .file-icon { color: #999; font-size: 14px; font-weight: normal; margin-left: 10px; }
        .doing-content { max-width: 100%; overflow-wrap: break-word; }
        .doing-content img { max-width: 100%; height: auto; border-radius: 4px; margin: 16px 0; }
        .doing-content pre { background: #f5f5f5; padding: 16px; border-radius: 4px; overflow-x: auto; font-size: 14px; position: relative; }
        .doing-content pre .copy-btn { position: absolute; top: 8px; right: 8px; background: #ddd; border: none; border-radius: 4px; padding: 4px 10px; font-size: 12px; cursor: pointer; opacity: 0.6; }
        .doing-content pre .copy-btn:hover { opacity: 1; }
        .doing-content blockquote { border-left: 4px solid #ddd; padding-left: 20px; margin: 16px 0; color: #666; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #1a73e8; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
        .loading, .empty, .error { padding: 32px 0; text-align: center; color: #888; }
        .error { color: #c0392b; }
    </style>
</head>
<body>
    <div class="container">
        <div class="site-title"><a href="/">Annoch (ᗜᴗᗜ)</a></div>
        <div class="site-desc"></div>
        <div id="nav-placeholder"></div>
        <div id="content"><div class="loading">加载中...</div></div>
        <div class="footer">&copy; 2026 Annoch (ᗜᴗᗜ)</div>
    </div>
    <script src="/assets/list-loader.js"></script>
    <script>
        loadList('essay', 'essay');
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('.doing-content pre code').forEach(function(block) {
                hljs.highlightElement(block);
            });
        });
    </script>
</body>
</html>
