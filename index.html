---
title: 主页
---
<div class="folder-grid">
    {% assign folders = site.pages | where_exp: "item", "item.dir != '/'" | map: "dir" | uniq | sort %}
    {% if folders.size == 0 %}
        <div class="empty-state">目前还没有内容 (ᗜᴗᗜ)</div>
    {% else %}
        {% for folder in folders %}
            {% assign folder_name = folder | remove: "/" %}
            <a href="{{ folder }}" class="folder-card">
                <div class="folder-name">{{ folder_name }}</div>
            </a>
        {% endfor %}
    {% endif %}
</div>
