name: 生成导航

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 生成 nav.json
        run: |
          echo '[' > nav.json
          nav_items=""
          for dir in */; do
            dir=${dir%/}
            if [ -f "$dir/index.html" ] && [ "$dir" != "assets" ] && [ "$dir" != ".github" ] && [ "$dir" != "about" ]; then
              title=$(grep -o '<title>[^<]*</title>' "$dir/index.html" | sed 's/<title>//' | sed 's/<\/title>//' | sed 's/ - Annoch//')
              nav_items="$nav_items{\"path\":\"$dir\",\"title\":\"$title\"},"
            fi
          done
          if [ -f "about/index.html" ]; then
            title=$(grep -o '<title>[^<]*</title>' "about/index.html" | sed 's/<title>//' | sed 's/<\/title>//' | sed 's/ - Annoch//')
            nav_items="$nav_items{\"path\":\"about\",\"title\":\"$title\"},"
          fi
          echo "$nav_items" | sed 's/,$//' >> nav.json
          echo ']' >> nav.json
          cat nav.json

      - name: 生成 index.json
        run: |
          echo '{"essay":[' > index.json
          find essay -maxdepth 1 -name "*.txt" -type f 2>/dev/null | sed 's/essay\///' | sed 's/\.txt//' | while read name; do
            echo "\"$name\"," >> index.json
          done
          sed -i '$ s/,$//' index.json
          echo '],"doing":[' >> index.json
          find doing -maxdepth 1 -name "*.txt" -type f 2>/dev/null | sed 's/doing\///' | sed 's/\.txt//' | while read name; do
            echo "\"$name\"," >> index.json
          done
          sed -i '$ s/,$//' index.json
          echo '],"playground":[' >> index.json
          find playground -maxdepth 1 -name "*.html" -type f 2>/dev/null | sed 's/playground\///' | sed 's/\.html//' | grep -v index | while read name; do
            echo "\"$name\"," >> index.json
          done
          sed -i '$ s/,$//' index.json
          echo ']}' >> index.json
          cat index.json

      - name: 提交文件
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nav.json index.json
          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "更新导航和索引"
            git push
          fi