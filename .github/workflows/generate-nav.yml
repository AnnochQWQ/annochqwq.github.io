name: 生成导航

on:
  push:
    paths:
      - '*/index.html'
      - '**/*.txt'
      - '**/*.html'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 扫描所有文件夹
        run: |
          echo '[' > nav.json
          for dir in */; do
            dir=${dir%/}
            if [ -f "$dir/index.html" ] && [ "$dir" != "assets" ] && [ "$dir" != ".github" ]; then
              title=$(grep -o '<title>[^<]*</title>' "$dir/index.html" | sed 's/<title>//' | sed 's/<\/title>//' | sed 's/ - Annoch//')
              echo "{\"path\":\"$dir\",\"title\":\"$title\"}," >> nav.json
            fi
          done
          sed -i '$ s/,$//' nav.json
          echo ']' >> nav.json

      - name: 扫描随笔列表
        run: |
          echo '{"essay":[' > index.json
          ls essay/*.txt 2>/dev/null | sed 's/essay\///' | sed 's/\.txt//' | while read name; do
            echo "\"$name\"," >> index.json
          done
          sed -i '$ s/,$//' index.json
          echo '],"doing":[' >> index.json
          ls doing/*.txt 2>/dev/null | sed 's/doing\///' | sed 's/\.txt//' | while read name; do
            echo "\"$name\"," >> index.json
          done
          sed -i '$ s/,$//' index.json
          echo '],"playground":[' >> index.json
          ls playground/*.html 2>/dev/null | sed 's/playground\///' | sed 's/\.html//' | grep -v index | while read name; do
            echo "\"$name\"," >> index.json
          done
          sed -i '$ s/,$//' index.json
          echo ']}' >> index.json

      - name: 提交 nav.json 和 index.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nav.json index.json
          git diff --staged --quiet || git commit -m "更新导航和索引"
          git push