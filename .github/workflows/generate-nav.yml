name: 生成导航

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 生成 nav.json
        run: |
          echo '[' > nav.json
          order="doing essay playground about"
          for dir in $order; do
            if [ -f "$dir/index.html" ]; then
              title=$(grep -o '<title>[^<]*</title>' "$dir/index.html" | sed 's/<title>//' | sed 's/<\/title>//' | sed 's/ - Annoch//')
              echo "{\"path\":\"$dir\",\"title\":\"$title\"}," >> nav.json
            fi
          done
          sed -i '$ s/,$//' nav.json
          echo ']' >> nav.json
          cat nav.json

      - name: 生成 index.json
        run: |
          echo '{"essay":[' > index.json
          find essay -maxdepth 1 -name "*.txt" -type f 2>/dev/null | sed 's/essay\///' | sed 's/\.txt//' | while read name; do
            echo "\"$name\"," >> index.json
          done
          sed -i '$ s/,$//' index.json
          echo '],"doing":[' >> index.json
          find doing -maxdepth 1 -name "*.txt" -type f 2>/dev/null | sed 's/doing\///' | sed 's/\.txt//' | while read name; do
            echo "\"$name\"," >> index.json
          done
          sed -i '$ s/,$//' index.json
          echo '],"playground":[' >> index.json
          find playground -maxdepth 1 -name "*.html" -type f 2>/dev/null | sed 's/playground\///' | sed 's/\.html//' | grep -v index | while read name; do
            echo "\"$name\"," >> index.json
          done
          sed -i '$ s/,$//' index.json
          echo ']}' >> index.json
          cat index.json

      - name: 提交文件
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nav.json index.json
          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "更新导航和索引"
            git push
          fi