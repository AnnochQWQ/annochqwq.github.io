name: 生成索引文件

on:
  push:
    paths:
      - 'essay/**'
      - 'doing/**'
      - 'playground/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 扫描文件夹
        run: |
          echo '{"essay":[' > index.json
          ls essay/*.txt 2>/dev/null | sed 's/essay\///' | sed 's/\.txt//' | while read name; do
            echo "\"$name\"," >> index.json
          done
          sed -i '$ s/,$//' index.json
          echo '],"doing":[' >> index.json
          ls doing/*.txt 2>/dev/null | sed 's/doing\///' | sed 's/\.txt//' | while read name; do
            echo "\"$name\"," >> index.json
          done
          sed -i '$ s/,$//' index.json
          echo '],"playground":[' >> index.json
          ls playground/*.html 2>/dev/null | sed 's/playground\///' | sed 's/\.html//' | grep -v index | while read name; do
            echo "\"$name\"," >> index.json
          done
          sed -i '$ s/,$//' index.json
          echo ']}' >> index.json

      - name: 提交 index.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.json
          git diff --staged --quiet || git commit -m "更新索引文件"
          git push